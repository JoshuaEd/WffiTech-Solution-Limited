    <section class="checkout-summary-section">
        <div class="container mb-4">
            <div class="d-flex gap-3 align-items-center ">
                <div class="icon back">
                    <i class=" bi-arrow-left-short"></i>
                </div>
                <div class="heade">
                    <h2 class=" fw-bold">Secure Checkout</h2>
                </div>
            </div>
        </div>

        <div class="container gap-3  d-lg-flex gap-5 ">

            <div class="left-col col-lg-8  ">


                <div class="customer-details-con card p-5 mb-4 rounded-3">
                    <div class="customer-address head d-flex align-items-center mb-4 gap-4 ">
                        <div class="number">1</div>
                        <h4>Delivery Address</h4>
                    </div>
                    <div class="inputs  ">
                        <form action="">
                            <div class="name-con  mb-3 d-lg-flex gap-3">
                                <div class="firstname p-3 outlined border border-2 rounded-3">
                                    <label for="firstname">First Name</label>
                                    <input type="text" value="Oshehor" name="firstname" id="firstname">
                                </div>
                                <div class="lastname p-3 outlined border border-2 rounded-3 mt-sm-3 m-lg-0"><label
                                        for="lastname">Last
                                        Name</label>
                                    <input type="text" value="Kesiena" name="lastname" id="lastname">
                                </div>

                            </div>
                            <div class="address-con mb-3 p-3 border border-2 rounded-3">
                                <label for="address">Stree Address</label>
                                <div class="addres-input d-lg-flex gap-2">
                                    <span class="location-icon">
                                        <i class="bi bi-geo-alt"></i>
                                    </span>
                                    <input type="text" value="Orhuwhorun, Udu" name="address" id="address">
                                </div>

                            </div>
                        </form>
                        <a href="@" class="add-address ">
                            <div class="d-flex align-items-center">
                                <div>
                                    <span class="icon">
                                        <i class="bi bi-plus"></i>
                                    </span>
                                </div>
                                <div>
                                    Add New Address
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
                <!-- Delivery method 2 -->
                <div class="delivery-method-con card p-5 mb-4 rounded-3 ">
                    <div class="delivery-method head mb-4 d-flex align-items-center gap-4 ">
                        <div class="number">2</div>
                        <h4>Delivery Method</h4>
                    </div>
                    <div class="methods gap-5 d-lg-flex">


                        <label for="delivery"
                            class="s-delivery  p-3 border rounded-3 gap-5 d-flex justify-content-between align-items-center">

                            <span class="icon">
                                <i class="bi bi-truck"></i>
                            </span>
                            <div class="delivery-text">
                                <p>Standard Delivery</p>
                                <small>3-5 Business Days</small>
                            </div>
                            <div>Free</div>

                            <input type="radio" id="standard-delivery" name="delivery">

                        </label>
                        <!-- <><><><><>< -->
                        <label for="delivery"
                            class="e-delivery d-flex gap-5 justify-content-between border rounded-3 p-3 align-items-center">
                            <span class="icon">
                                <i class="bi bi-lightning-charge"></i>
                            </span>
                            <div class="delivery-text">
                                <p>Express Delivery</p>
                                <small>Tomorrow, by 12 PM</small>
                            </div>
                            <div class="express-d-price">N3900.00</div>
                            <input type="radio" name="delivery" id="exclusive-delivery">

                        </label>






                    </div>
                </div>
                <!-- Payment method -->
                <div class="payment-method-con card p-5 mb-4 rounded-3">
                    <div class="delivery-method head mb-4 d-flex align-items-center gap-4 ">
                        <div class="number">3</div>
                        <h4>Payment Method</h4>
                    </div>
                    <div class="methods">
                        <form action="" class="d-l gap-5">
                            <label for="card-payment" class="d-block">
                                <div class="radio-con d-flex  align-items-center gap-3 p-2 border rounded-3 mb-2 ">
                                    <div class="r-con">
                                        <input type="radio" name="payment-method" id="card-payment">
                                    </div>



                                    <span class="icon">
                                        <i class="bi bi-credit-card-2-front"></i>
                                    </span>
                                    Credit or Debit Card
                                </div>
                            </label>

                            <label for="mobile-payment" class="d-block">
                                <div class="radio-con d-flex align-items-center rounded-3 gap-3 p-2 border mt-2">
                                    <div class="r-con">
                                        <input type="radio" name="payment-method" id="mobile-payment">
                                    </div>
                                    <span class="icon">
                                        <i class="bi bi-phone"></i>
                                    </span>
                                    Mobile Money
                            </label>

                        </form>
                    </div>
                </div>
            </div>

        </div>
